services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/store_intel.db
      DB_AVAILABLE: "true"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health', timeout=5).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    command: ["python", "dashboard/server.py"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      STORE_ID: STORE_BLR_002
    volumes:
      - ./dashboard:/app/dashboard
